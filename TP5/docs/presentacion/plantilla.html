<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TP5 · Deep Learning · Grupo 8</title>
<!--
  Generado por experiments/presentacion_html.py a partir de esta plantilla y de laminas.json.
  NO editar presentacion.html a mano: se edita laminas.json (textos) o esta plantilla (estilo) y se
  vuelve a correr `.venv/bin/python -m experiments.presentacion` desde TP5/.
  Teclas: → / espacio / PgDn avanza · ← / PgUp retrocede · Inicio / Fin · F pantalla completa ·
  N muestra u oculta las notas del orador.
-->
<!--__KATEX__-->
<style>
:root {
  --bg: #ffffff; --fondo: #f4f3ee; --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #8a8984; --line: #c3c2b7;
  --AE: #2a78d6; --DAE: #eb6834; --VAE: #1baf7a;
  --sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #dddcd7; font-family: var(--sans); color: var(--ink); }
#stage { width: 1600px; height: 900px; position: absolute; left: 50%; top: 50%; background: var(--bg); transform-origin: center center; overflow: hidden; }
.slide { position: absolute; inset: 0; padding: 50px 84px 62px 96px; display: none; grid-template-rows: auto auto minmax(0, 1fr) auto; --color: var(--ink-2); }
.slide.on { display: grid; }
.slide.AE { --color: var(--AE); } .slide.DAE { --color: var(--DAE); } .slide.VAE { --color: var(--VAE); }
.slide::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 22px; background: var(--color); }
.item { font-size: 21px; font-weight: 700; color: var(--color); letter-spacing: .01em; min-height: 26px; }
.slide h2 { margin: 8px 0 0; font-size: 46px; line-height: 1.14; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.fig { margin-top: 24px; min-height: 0; display: flex; align-items: center; justify-content: center; }
.fig img { max-width: 100%; max-height: 100%; display: block; }
.lectura { margin: 20px 0 0; font-size: 31px; line-height: 1.32; color: var(--ink); max-width: 1320px; }
.pagina { position: absolute; right: 44px; bottom: 26px; font-size: 17px; color: var(--ink-3); }
.pagina .presenta { color: var(--color); font-weight: 600; }
/* Teoría: esquema arriba, fórmulas abajo */
.slide.teoria .fig { flex-direction: column; justify-content: flex-start; gap: 34px; padding-top: 26px; }
.slide.teoria .fig img { max-height: 190px; }
.tex { font-size: 36px; line-height: 1.5; text-align: center; }
/* Portada y cierres */
.slide.portada, .slide.cierre { background: var(--fondo); grid-template-rows: 1fr; align-content: center; padding-left: 150px; }
.slide.portada > div, .slide.cierre > div { align-self: center; }
.slide.portada h1 { margin: 0; font-size: 84px; letter-spacing: -0.02em; }
.slide.portada .sub { margin: 18px 0 0; font-size: 38px; color: var(--ink-2); }
.slide.portada .barras { display: flex; gap: 16px; margin: 54px 0; }
.slide.portada .barras i { width: 130px; height: 12px; }
.slide.portada .pie { font-size: 26px; color: var(--ink-2); }
.slide.cierre h2 { font-size: 64px; line-height: 1.12; max-width: 1250px; }
.slide.cierre p { margin: 26px 0 0; font-size: 36px; color: var(--ink-2); }
.slide.cierre h2 + p { margin-top: 54px; }
/* Notas del orador: ocultas salvo con la tecla N */
.notas { display: none; position: absolute; left: 22px; right: 0; bottom: 0; background: rgba(11, 11, 11, .92); color: #fff; font-size: 21px; line-height: 1.4; padding: 18px 44px 20px 74px; }
body.con-notas .slide.on .notas { display: block; }
/* Impresión y PDF: todas las láminas, una por página de 1600 × 900, sin notas */
@page { size: 1600px 900px; margin: 0; }
@media print {
  html, body { height: auto; overflow: visible; background: var(--bg); }
  #stage { position: static; transform: none !important; width: 1600px; height: auto; overflow: visible; }
  .slide { position: relative; display: grid !important; width: 1600px; height: 900px; break-after: page; overflow: hidden; }
  .slide:last-child { break-after: auto; }
  .notas { display: none !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div id="stage">
<!--__LAMINAS__-->
</div>
<script>
const stage = document.getElementById('stage');
const laminas = [...document.querySelectorAll('.slide')];
document.querySelectorAll('.tex').forEach(el => katex.render(el.dataset.tex, el, { throwOnError: true, displayMode: true }));
let actual = 0;
function ir(i) {
  actual = Math.max(0, Math.min(laminas.length - 1, i));
  laminas.forEach((l, k) => l.classList.toggle('on', k === actual));
  history.replaceState(null, '', '#' + (actual + 1));
}
window.__irA = n => ir(n - 1);
function ajustar() {
  const e = Math.min(innerWidth / 1600, innerHeight / 900);
  stage.style.transform = `translate(-50%, -50%) scale(${e})`;
}
addEventListener('resize', ajustar); ajustar();
document.addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'PageDown'].includes(e.key)) { ir(actual + 1); e.preventDefault(); }
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) { ir(actual - 1); e.preventDefault(); }
  else if (e.key === 'Home') ir(0);
  else if (e.key === 'End') ir(laminas.length - 1);
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  else if (e.key === 'n' || e.key === 'N') document.body.classList.toggle('con-notas');
});
ir((parseInt(location.hash.slice(1), 10) || 1) - 1);
</script>
</body>
</html>
